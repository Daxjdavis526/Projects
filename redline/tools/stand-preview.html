<!doctype html>
<html><head><meta charset="utf-8"><title>stand preview</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/jsm/" } }</script>
</head><body>
<script type="module">
/* A still of one stand's 3D hardware from a named view — no session, no
   simulation: for looking at the models. Driven by tools/stand-preview.mjs.
   ?stand=TS-2&view=x,y,z,tx,ty,tz,fov&clock=30600 */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { STANDS } from '../src/content/programs.js';
import { Environment } from '../src/ui/cell/environment.js';
import { buildStand } from '../src/ui/cell/stands.js';
const q = new URLSearchParams(location.search);
const def = STANDS[q.get('stand') || 'TS-2'];
const W = +(q.get('w') || 1400), H = +(q.get('h') || 800);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(r.domElement);
const scene = new THREE.Scene();
const env = new Environment(); scene.add(env.group); scene.fog = env.fog;
if (!q.get('people')) for (const p of env.people) p.visible = false; else env.people.forEach((p, i) => p.position.set(-1.2 + i * 0.7, 0, 1.2));
env.setTime(+(q.get('clock') || 30600));
env.applyEnvironment?.(r, scene);
const stand = buildStand(def); scene.add(stand.group);
const v = (q.get('view') || '-3.25,3.3,3.55,0,0.9,-0.6,46').split(',').map(Number);
const cam = new THREE.PerspectiveCamera(v[6], W / H, 0.01, 2500);
cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]);
const comp = new EffectComposer(r); comp.addPass(new RenderPass(scene, cam)); comp.addPass(new OutputPass());
comp.render();
window.done = true;
</script></body></html>
