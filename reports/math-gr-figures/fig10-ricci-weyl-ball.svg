<text x="116" y="26" font-size="13" text-anchor="middle" fill="#1d2025" font-weight="bold">Ricci</text>
<text x="116" y="42" font-size="11.5" text-anchor="middle" fill="#5b616b">(inside matter)</text>
<text x="340" y="26" font-size="13" text-anchor="middle" fill="#1d2025" font-weight="bold">Weyl</text>
<text x="340" y="42" font-size="11.5" text-anchor="middle" fill="#5b616b">(empty space near a mass)</text>
<text x="564" y="26" font-size="13" text-anchor="middle" fill="#1d2025" font-weight="bold">Weyl</text>
<text x="564" y="42" font-size="11.5" text-anchor="middle" fill="#5b616b">(gravitational wave)</text>
<text x="116" y="250" font-size="12" text-anchor="middle" fill="#1d2025">volume decreases:</text>
<text x="116" y="268" font-size="12" text-anchor="middle" fill="#1d2025"><tspan font-style="italic">V̈</tspan>/<tspan font-style="italic">V</tspan> = −4π<tspan font-style="italic">G</tspan>(<tspan font-style="italic">ρ</tspan> + 3<tspan font-style="italic">p</tspan>/<tspan font-style="italic">c</tspan>²)</text>
<text x="340" y="250" font-size="12" text-anchor="middle" fill="#1d2025">shape changes,</text>
<text x="340" y="268" font-size="12" text-anchor="middle" fill="#1d2025">volume does not (tides)</text>
<text x="564" y="250" font-size="12" text-anchor="middle" fill="#1d2025">plus-polarized wave</text>
