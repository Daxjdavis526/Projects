<!doctype html>
<!-- =============================================================================
     SPIRE - a tower from an architect's sketchbook, drawn and then built.
     Static files, no build step: python3 -m http.server and open /spire/.
     ?by=Name puts the architect's name on the title card; ?title= renames it.
     ========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spire</title>
<meta name="description" content="A tower from an architect's sketchbook: first drawn in ink, then built in glass on the water.">
<style>
:root{
  --paper:#f3efe6;
  --ink:#1c1a18;
  --fg:var(--ink);
  --dim:rgba(28,26,24,.55);
  --line:rgba(28,26,24,.22);
  --chip:rgba(243,239,230,.7);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,ui-serif,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
body[data-mode="built"]{
  --fg:#f4f1ea;
  --dim:rgba(244,241,234,.66);
  --line:rgba(244,241,234,.28);
  --chip:rgba(14,16,20,.32);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* a soft shade under the title so it reads against a bright sky */
.scrim{position:fixed;left:0;top:0;width:min(70vw,620px);height:min(45vh,360px);pointer-events:none;
  background:radial-gradient(ellipse at 0 0,rgba(10,12,16,.38),rgba(10,12,16,0) 70%);opacity:0;transition:opacity 2.4s ease}
body[data-mode="built"] .scrim{opacity:1}

.card{
  position:fixed;left:clamp(16px,4vw,48px);top:clamp(16px,5vh,52px);
  color:var(--fg);pointer-events:none;
  transition:color 2.4s ease;
  text-shadow:0 0 18px rgba(0,0,0,0);
}
body[data-mode="built"] .card{text-shadow:0 1px 14px rgba(0,0,0,.35)}
.card .kicker{
  font:500 11px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--dim);
  transition:color 2.4s ease;
}
.card h1{
  margin:.35em 0 .1em;font:400 clamp(40px,7vw,76px)/1 var(--serif);letter-spacing:.06em;
}
.card #by{font:italic 400 clamp(15px,1.7vw,19px)/1.3 var(--serif);color:var(--dim);transition:color 2.4s ease}

#life{
  position:fixed;left:clamp(16px,4vw,48px);top:calc(clamp(16px,5vh,52px) + clamp(40px,7vw,76px) + 96px);transform:translate(0,12px);
  font:italic 400 clamp(18px,2.2vw,22px)/1 var(--serif);letter-spacing:.02em;
  color:var(--ink);background:rgba(243,239,230,.75);border:1.5px solid var(--ink);
  padding:.8em 1.6em;border-radius:999px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity 1.6s ease, transform 1.6s ease, background .3s, color .3s;
}
#life.shown{opacity:1;pointer-events:auto;transform:translate(0,0)}
#life:hover{background:var(--ink);color:var(--paper)}
#life.gone{opacity:0;pointer-events:none;transition:opacity .6s ease}

.bar{
  position:fixed;left:50%;bottom:clamp(14px,3vh,28px);transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 32px);
  color:var(--fg);font:500 12px/1 var(--sans);letter-spacing:.06em;
  transition:color 2.4s ease;
}
.seg,.pill{
  display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;
  background:var(--chip);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background 2.4s ease,border-color 2.4s ease;
}
.seg button,.pill button{
  font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  padding:8px 14px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;font-size:11px;
}
.seg button.on{background:var(--fg);color:var(--paper)}
body[data-mode="built"] .seg button.on{color:#14161a}
.pill button.on{background:var(--line)}
.time{display:flex;align-items:center;gap:12px;padding:6px 16px 6px 18px}
.time label{min-width:9ch;white-space:nowrap;text-transform:uppercase;font-size:11px;letter-spacing:.12em}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:clamp(120px,22vw,240px);height:2px;background:var(--line);border-radius:2px;outline:none;
}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);cursor:pointer;border:0}
body:not([data-mode="built"]) .built-only{display:none}

.hint{
  position:fixed;right:clamp(16px,4vw,48px);top:clamp(20px,5vh,56px);
  color:var(--dim);font:400 11px/1.6 var(--sans);letter-spacing:.08em;text-align:right;
  transition:color 2.4s ease;pointer-events:none;
}
@media (max-width:640px){ .hint{display:none} }
@media (hover:none){ .hint .keys{display:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/jsm/"
} }
</script>
</head>
<body data-mode="sketch">
<canvas id="view"></canvas>
<div class="scrim"></div>

<div class="card">
  <div class="kicker">From the sketchbook</div>
  <h1 id="title">Spire</h1>
  <div id="by">A tower, first in ink</div>
</div>

<div class="hint">Drag to turn · scroll to approach<br><span class="keys">Space: sketch / built · M: model</span></div>

<button id="life">Bring it to life</button>

<div class="bar">
  <div class="seg">
    <button id="mode-sketch" class="on">Sketch</button>
    <button id="mode-model" title="White massing model, like the 3D print">Model</button>
    <button id="mode-built">Built</button>
  </div>
  <div class="pill time built-only">
    <label id="time-label">Golden hour</label>
    <input id="time" type="range" min="0" max="1" step="0.001" aria-label="Time of day">
  </div>
  <div class="pill built-only">
    <button id="orbit" title="Slow orbit (O)">Orbit</button>
    <button id="snap" title="Save this view as an image">Save image</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
