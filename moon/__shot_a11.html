<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildApollo11 } from '/src/models/apollo11.js';

const W=1400,H=900;
const r=new THREE.WebGLRenderer({antialias:true});
r.setSize(W,H); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.35;
document.body.appendChild(r.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
// Mare Tranquillitatis albedo, roughly, so the decals can be judged against it.
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),
  new THREE.MeshStandardMaterial({color:0x565044,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// Sun at the landing geometry: azimuth 88.8, elevation 10.7.
const az=88.81*Math.PI/180, el=10.7*Math.PI/180;
const sd=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el));
const sun=new THREE.DirectionalLight(0xfff4e6, 3.2);
sun.position.copy(sd).multiplyScalar(120); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const c=sun.shadow.camera; c.left=-22;c.right=22;c.top=22;c.bottom=-22;c.near=40;c.far=220;
scene.add(sun);

const a=buildApollo11({quality:'high'});
a.setMarkers(true);
a.animate({dt:0.016,sunDir:sd});
scene.add(a.group);

const cam=new THREE.PerspectiveCamera(42,W/H,0.05,2000);
const views={
  hero:[[-11,4.2,-9],[0,2.0,0]],
  sunlit:[[13,4.0,-7],[0,2.0,0]],
  top:[[6,44,10],[6,0,10]],
  top2:[[0,26,2],[0,0,2]],
  flag:[[-4.6,1.4,-6.0],[-7.6,0.1,-4.6]],
  ladder:[[-7.2,1.9,-2.2],[-2.6,1.9,-0.4]],
  wide:[[-26,14,-24],[2,0,4]],
  lrrr:[[-3.6,1.0,17.5],[-2.0,0.25,21.6]],
  east:[[-14,7,-3],[24,0,-1]],
};
window.shoot=(k)=>{const v=views[k];cam.position.set(...v[0]);cam.lookAt(...v[1]);r.render(scene,cam);return r.domElement.toDataURL('image/png');};
window.__ready=true;
window.addEventListener('error',e=>{window.__err=e.error?.stack||e.message;});
</script>
