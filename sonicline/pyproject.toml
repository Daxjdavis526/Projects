[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sonicline"
version = "0.1.0"
description = "Propulsion CFD for cold-gas thrusters, with OpenFOAM as the numerical backend"
readme = "README.md"
requires-python = ">=3.11"
# core/ needs only these. CoolProp supplies the reference nitrogen equation
# of state used for real-gas corrections and regulator cooling estimates.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "CoolProp>=8.0",
]

[project.optional-dependencies]
geometry = ["gmsh>=4.15", "trimesh>=5.0"]
mesh = ["classy_blocks>=1.12"]
post = ["pyvista>=0.49"]
ui = ["PySide6>=6.11", "pyvistaqt>=0.13", "pyqtgraph>=0.14"]
dev = ["pytest>=8"]

[project.scripts]
sonicline = "sonicline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["openfoam: runs OpenFOAM (skipped when it is not installed)"]
