# Tests SONICLINE (sonicline/, a Python CFD application driving OpenFOAM)
# whenever it changes. The core runs on Linux and on Windows, because the
# application is used on Windows. A second job installs ESI OpenFOAM v2512
# and runs the fast verification tier end to end: mesh, solve, and compare
# with analytical theory. The rest of the repository is static pages and is
# not touched by this workflow.
name: SONICLINE tests

on:
  push:
    paths:
      - 'sonicline/**'
      - '.github/workflows/sonicline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e "./sonicline[dev]"

      - name: Unit and theory tests
        run: python -m pytest sonicline/tests

  openfoam:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenFOAM v2512 and the libraries gmsh and VTK need
        run: |
          curl -sSfL --retry 4 https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -qq openfoam2512 libglu1-mesa libosmesa6 libxcursor1 \
            libxinerama1 libxft2

      - name: Install
        run: python -m pip install -e "./sonicline[dev,geometry,post]"

      - name: Geometry (STEP round trip through the CAD kernel)
        run: python -m pytest sonicline/tests/test_geometry.py -v

      - name: OpenFOAM verification (V1, V4a on standard wedge meshes)
        run: python -m pytest sonicline/tests -v -m openfoam
