<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>PRIMEVAL · hangar</title>
<style>
  html,body{margin:0;height:100%;background:#07090b;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
  #i{position:fixed;left:12px;top:12px;color:#8a857c;font:11px/1.6 monospace;letter-spacing:.1em;z-index:2}
  #i b{color:#ffb347;font-weight:400}
  #i button{font:10px monospace;background:#15181b;color:#9a948b;border:1px solid #2a2e33;padding:5px 8px;margin-right:4px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="i"><b>HALBERD</b> — drag to orbit, wheel to zoom<br>
<button id="bGear">GEAR</button><button id="bRamp">RAMP</button><button id="bBurn">BURN</button><button id="bHeat">REENTRY</button></div>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { buildShip, buildCockpit } from '../src/ship/model.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090b);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 2000);
const key = new THREE.DirectionalLight(0xfff4e6, 3.0); key.position.set(14, 18, -10); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-30; key.shadow.camera.right=30;
key.shadow.camera.top=30; key.shadow.camera.bottom=-30; key.shadow.camera.far=90;
const rim = new THREE.DirectionalLight(0x74b6ff, 2.6); rim.position.set(-16, 6, 16);
const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(0, -6, -18);
scene.add(key, rim, fill, new THREE.HemisphereLight(0x33506b, 0x0d0f12, 1.1));
const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 64).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color: 0x14171a, roughness: 1 }));
ground.position.y = -3.4; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(90, 45, 0x243038, 0x141a1e);
grid.position.y = -3.39;
scene.add(grid);

const ship = buildShip();
scene.add(ship.group);
const cockpit = buildCockpit();
ship.group.add(cockpit.group);

// The exosuit shares this viewer once it exists.
let mech = null;
import('../src/player/mechmodel.js').then(m => {
  mech = m.buildMech();
  mech.group.position.set(0, -3.4, 18);
  mech.group.visible = new URLSearchParams(location.search).get('mech') === '1';
  scene.add(mech.group);
}).catch(() => {});

let gearDown = true, rampDown = false, burn = 0, heat = 0;
document.getElementById('bGear').onclick = () => gearDown = !gearDown;
document.getElementById('bRamp').onclick = () => rampDown = !rampDown;
document.getElementById('bBurn').onclick = () => burn = burn > 0.5 ? 0 : 1;
document.getElementById('bHeat').onclick = () => heat = heat > 0.5 ? 0 : 1;

let yaw = 0.9, pitch = 0.22, dist = 34, dragging = false, px = 0, py = 0;
const qp = new URLSearchParams(location.search);
if (qp.has('yaw')) yaw = parseFloat(qp.get('yaw'));
if (qp.has('pitch')) pitch = parseFloat(qp.get('pitch'));
if (qp.has('dist')) dist = parseFloat(qp.get('dist'));
if (qp.has('gear')) gearDown = qp.get('gear') === '1';
if (qp.has('burn')) burn = parseFloat(qp.get('burn'));
if (qp.has('heat')) heat = parseFloat(qp.get('heat'));
if (qp.has('ramp')) rampDown = qp.get('ramp') === '1';
canvas.addEventListener('mousedown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => { if (!dragging) return;
  yaw -= (e.clientX - px) * 0.006; pitch = Math.max(-1.2, Math.min(1.3, pitch + (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY; });
addEventListener('wheel', e => { dist = Math.max(6, Math.min(220, dist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: true });
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let t = 0;
function loop(){
  requestAnimationFrame(loop);
  t += 0.016;
  const gt = gearDown ? 1 : 0;
  for (const g of ship.gear) {
    g.userData.t = THREE.MathUtils.lerp(g.userData.t ?? gt, gt, 0.06);
    g.rotation.x = (1 - g.userData.t) * 1.5;
    g.visible = g.userData.t > 0.02;
  }
  ship.ramp.rotation.x = THREE.MathUtils.lerp(ship.ramp.rotation.x, rampDown ? 0.85 : 0, 0.07);
  ship.plumeMat.opacity = burn * (0.42 + Math.sin(t * 40) * 0.05);
  ship.emisU.value = 0.5 + burn * 1.6;
  ship.heatU.value = THREE.MathUtils.lerp(ship.heatU.value, heat, 0.05);
  ship.engineLight.intensity = burn * 24;
  camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist, Math.sin(pitch)*dist, Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
