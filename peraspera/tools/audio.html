<!doctype html>
<!-- Renders stretches of the soundtrack offline (no speaker needed) and reports
     their loudness, for checking the mix. Driven by tools/audio-check.mjs. -->
<meta charset="utf-8">
<canvas id="c" width="1600" height="400"></canvas>
<script type="module">
import { Score } from '../src/score.js';
import { TIMELINE } from '../src/script.js';

// Render [T, T+dur) and return per-second RMS and peak (dBFS) plus a spectrogram.
window.renderSpan = async (T, dur, draw = false) => {
  const sr = 22050;
  const oac = new OfflineAudioContext(2, Math.ceil(sr * dur), sr);
  const s = new Score(oac);
  s.renderRange(T, dur);
  const buf = await oac.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const rms = [], peak = [];
  let nan = 0;
  for (let i = 0; i < dur; i++) {
    let sum = 0, pk = 0;
    for (let j = i * sr; j < Math.min((i + 1) * sr, L.length); j++) {
      const v = (L[j] + R[j]) / 2;
      if (!Number.isFinite(v)) { nan++; continue; }
      sum += v * v; pk = Math.max(pk, Math.abs(L[j]), Math.abs(R[j]));
    }
    rms.push(+(10 * Math.log10(sum / sr + 1e-12)).toFixed(1));
    peak.push(+(20 * Math.log10(pk + 1e-9)).toFixed(1));
  }
  if (draw) {
    // a quick log-frequency spectrogram, one column per 1/40 s
    const c = document.getElementById('c'), g = c.getContext('2d');
    const cols = Math.floor(dur * 40), N = 2048;
    c.width = cols; g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
    for (let x = 0; x < cols; x++) {
      const off = Math.floor((x / 40) * sr);
      for (let y = 0; y < 400; y++) {
        const f = 40 * Math.pow(2, (1 - y / 400) * 8.5);
        const k = f / sr * N;
        let re = 0, im = 0;
        for (let n = 0; n < N; n += 2) { const v = L[off + n] || 0; const w = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / N); re += v * w * Math.cos(2 * Math.PI * k * n / N); im -= v * w * Math.sin(2 * Math.PI * k * n / N); }
        const m = Math.min(1, Math.max(0, (20 * Math.log10(Math.hypot(re, im) + 1e-9) + 20) / 60));
        g.fillStyle = `rgb(${m * 255 | 0},${m * m * 200 | 0},${m * 90 | 0})`;
        g.fillRect(x, y, 1, 1);
      }
    }
  }
  return { rms, peak, nan };
};
window.timeline = TIMELINE.map((s) => ({ id: s.id, start: s.start, dur: s.dur }));
window.__ready = true;
</script>
